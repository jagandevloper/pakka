<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>OA Coder</title>
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
  <style>
    :root {
      --bg-primary: rgba(255, 255, 255, 0.95);
      --bg-secondary: rgba(240, 240, 240, 0.8);
      --bg-overlay: rgba(255, 255, 255, 0.9);
      --text-primary: #333;
      --text-secondary: #666;
      --text-muted: #888;
      --border-color: rgba(0, 0, 0, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --accent-color: #2196F3;
      --error-color: #c62828;
      --error-bg: rgba(255, 240, 240, 0.8);
      --success-color: #2e7d32;
      --code-bg: rgba(240, 240, 240, 0.8);
    }
    
    .dark-mode {
      --bg-primary: rgba(30, 30, 30, 0.95);
      --bg-secondary: rgba(45, 45, 45, 0.9);
      --bg-overlay: rgba(20, 20, 20, 0.95);
      --text-primary: #e0e0e0;
      --text-secondary: #aaa;
      --text-muted: #777;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --error-bg: rgba(60, 30, 30, 0.9);
      --code-bg: rgba(45, 45, 45, 0.9);
    }
    
    html {
      width: 100%;
      height: 100%;
      background: none;
    }
    
    body {
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100%;
      background: none;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }
    
    body * {
      pointer-events: auto;
    }
    
    /* Draggable area - entire response box header is draggable */
    .drag-handle {
      -webkit-app-region: drag;
      cursor: move;
      background: var(--bg-secondary);
      padding: 8px 12px;
      border-radius: 6px 6px 0 0;
      margin: -18px -18px 12px -18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    
    .drag-handle * {
      -webkit-app-region: no-drag;
    }
    
    .drag-handle-title {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .model-badge {
      background: var(--accent-color);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
    }
    
    .drag-handle-actions {
      display: flex;
      gap: 6px;
    }
    
    .drag-handle-actions button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    .drag-handle-actions button:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    #instruction-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 3px 10px;
      font-size: 10px;
      border-radius: 0 0 4px 4px;
      z-index: 9999;
      box-shadow: 0 1px 3px var(--shadow-color);
      user-select: none;
      border: 1px solid var(--border-color);
      pointer-events: none;
    }
    
    #response-overlay {
      position: fixed;
      top: 0; 
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-overlay);
      opacity: 0;
      visibility: hidden;
      z-index: 9998;
      backdrop-filter: blur(3px);
    }
    
    #response-overlay.visible {
      opacity: 1;
      visibility: visible;
    }
    
    #response-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 900px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 18px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow-color);
      border: 1px solid var(--border-color);
    }
    
    #response-box::-webkit-scrollbar { width: 8px; }
    #response-box::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
    #response-box::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }
    
    pre {
      background: var(--code-bg);
      color: var(--text-primary);
      padding: 12px;
      border-radius: 5px;
      white-space: pre;
      overflow-x: auto;
      margin: 0.8em 0;
      border: 1px solid var(--border-color);
      font-size: 12px;
      position: relative;
    }
    
    pre::before {
      content: attr(data-language);
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    code {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      background: var(--code-bg);
      color: var(--text-primary);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 12px;
    }
    
    pre code { background: transparent; padding: 0; }
    
    #response-box p { margin: 0 0 10px 0; }
    #response-box p:last-child { margin-bottom: 0; }
    #response-box h1, #response-box h2, #response-box h3 { color: var(--text-primary); margin: 1em 0 0.5em 0; font-weight: 600; }
    #response-box h1:first-child, #response-box h2:first-child, #response-box h3:first-child { margin-top: 0; }
    #response-box ul, #response-box ol { margin: 0.5em 0; padding-left: 1.5em; }
    #response-box li { margin: 0.3em 0; }
    #response-box blockquote { border-left: 3px solid var(--accent-color); margin: 0.8em 0; padding: 0.5em 1em; background: var(--bg-secondary); border-radius: 0 4px 4px 0; }
    
    .error-message {
      color: var(--error-color);
      background: var(--error-bg);
      padding: 12px;
      border-radius: 5px;
      border-left: 3px solid var(--error-color);
      margin: 8px 0;
      font-size: 13px;
    }

    #notification {
      position: fixed;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 11px;
      border-radius: 4px;
      z-index: 10000;
      box-shadow: 0 2px 8px var(--shadow-color);
      opacity: 0;
      visibility: hidden;
      border: 1px solid var(--border-color);
      pointer-events: none;
    }
    
    #notification.visible { opacity: 1; visibility: visible; }
    
    #history-panel, #settings-panel, #model-panel {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      background: var(--bg-primary);
      border-radius: 8px;
      box-shadow: 0 4px 20px var(--shadow-color);
      z-index: 10002;
      overflow: hidden;
    }
    
    #history-panel.visible, #settings-panel.visible, #model-panel.visible { display: block; }
    
    .panel-header {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-header h3 { margin: 0; font-size: 14px; color: var(--text-primary); }
    .panel-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px; padding: 0; line-height: 1; }
    .panel-content { padding: 12px; max-height: calc(80vh - 50px); overflow-y: auto; }
    
    .history-item {
      padding: 10px;
      border-radius: 4px;
      background: var(--bg-secondary);
      margin-bottom: 8px;
      cursor: pointer;
    }
    
    .history-item:hover { background: var(--border-color); }
    .history-item-time { font-size: 10px; color: var(--text-muted); }
    .history-item-model { font-size: 11px; color: var(--accent-color); margin-top: 2px; }
    .history-item-preview { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.4; }
    
    .settings-group { margin-bottom: 16px; }
    .settings-group-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
    .settings-item label { font-size: 13px; color: var(--text-primary); }
    .settings-item input[type="checkbox"] { width: 18px; height: 18px; }
    
    .streaming-cursor { display: inline-block; width: 8px; height: 14px; background: var(--accent-color); margin-left: 2px; animation: blink 1s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    
    .copy-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--bg-secondary);
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0;
    }
    
    pre:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--accent-color); color: white; }
    
    /* Chat input box */
    #chat-container {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }
    
    #chat-form {
      display: flex;
      gap: 8px;
    }
    
    #chat-input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    
    #chat-input::placeholder {
      color: var(--text-muted);
    }
    
    #chat-input:focus {
      border-color: var(--accent-color);
    }
    
    #chat-send {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    
    #chat-send:hover {
      opacity: 0.9;
    }
    
    #chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Model selector dropdown */
    .model-selector {
      margin-bottom: 12px;
    }
    
    .model-selector label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }
    
    .model-selector select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    
    .model-selector select:focus {
      border-color: var(--accent-color);
    }
    
    .provider-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    
    .provider-tab {
      padding: 6px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    
    .provider-tab.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    
    .settings-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      margin-top: 8px;
    }
    
    .settings-btn:hover {
      opacity: 0.9;
    }
    
    .settings-input {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    /* Floating toolbar */
    #floating-toolbar {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10003;
    }
    
    .floating-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px var(--shadow-color);
      transition: transform 0.2s, background 0.2s;
    }
    
    .floating-btn:hover {
      transform: scale(1.1);
      background: var(--accent-color);
      color: white;
    }
    
    /* Transparency slider */
    .transparency-control {
      margin: 8px 0;
    }
    
    .transparency-control label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .transparency-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-secondary);
      border-radius: 3px;
      outline: none;
    }
    
    .transparency-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }
    
    .transparency-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div id="instruction-banner"></div>
  <div id="notification"></div>
  

  
  <div id="response-overlay">
    <div id="response-box"></div>
  </div>
  
  <div id="history-panel">
    <div class="panel-header">
      <h3>Response History</h3>
      <button class="panel-close" onclick="hideHistory()">&times;</button>
    </div>
    <div class="panel-content" id="history-content"></div>
  </div>
  
  <div id="settings-panel">
    <div class="panel-header">
      <h3>Settings</h3>
      <button class="panel-close" onclick="hideSettings()">&times;</button>
    </div>
    <div class="panel-content" id="settings-content"></div>
  </div>
  
  <div id="model-panel">
    <div class="panel-header">
      <h3>Select Model</h3>
      <button class="panel-close" onclick="hideModelPanel()">&times;</button>
    </div>
    <div class="panel-content" id="model-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    const { ipcRenderer, clipboard } = require('electron');
    
    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });
    
    let darkMode = false;
    let currentModel = { name: '', displayName: 'Loading...' };
    let currentProvider = 'openrouter';
    let providers = [];
    let isProcessing = false;
    let transparency = 95;
    
    function setDarkMode(enabled) {
      darkMode = enabled;
      document.body.classList.toggle('dark-mode', enabled);
      document.getElementById('hljs-light').disabled = enabled;
      document.getElementById('hljs-dark').disabled = !enabled;
    }
    
    const showOverlay = () => document.getElementById('response-overlay').classList.add('visible');
    const hideOverlay = () => document.getElementById('response-overlay').classList.remove('visible');
    const updateBanner = (text, show = true) => {
      const banner = document.getElementById('instruction-banner');
      banner.style.display = show ? 'block' : 'none';
      if (text) banner.textContent = text;
    };
    
    function renderMarkdown(content) {
      let html = marked.parse(content);
      html = html.replace(/<pre><code([^>]*)>/g, (match, attrs) => {
        const langMatch = attrs.match(/class="language-(\w+)"/);
        const lang = langMatch ? langMatch[1] : '';
        return `<pre data-language="${lang}"><button class="copy-btn" onclick="copyCodeBlock(this)">Copy</button><code${attrs}>`;
      });
      return html;
    }
    
    function renderResponseWithUI(content, showChat = true) {
      const chatForm = '';
      
      return `
        <div class="drag-handle">
          <div class="drag-handle-title">
            <span class="model-badge" onclick="showModelPanel()" style="cursor:pointer">${currentModel.displayName || 'Select Model'}</span>
          </div>
          <div class="drag-handle-actions">
            <button onclick="showModelPanel()" title="Change Model">🔄</button>
            <button onclick="ipcRenderer.send('copy-result')" title="Copy">📋</button>
            <button onclick="ipcRenderer.send('request-settings')" title="Settings">⚙️</button>
            <button onclick="ipcRenderer.send('reset-view')" title="Hide">✕</button>
          </div>
        </div>
        <div class="response-content">${renderMarkdown(content)}</div>
        ${chatForm}`;
    }
    
    window.copyCodeBlock = function(btn) {
      const code = btn.parentElement.querySelector('code');
      if (code) {
        clipboard.writeText(code.textContent);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }
    };
    
    function showHistory(entries) {
      const content = document.getElementById('history-content');
      content.innerHTML = (!entries || entries.length === 0) 
        ? '<p style="color: var(--text-muted); text-align: center;">No history yet</p>'
        : entries.map(e => `<div class="history-item" onclick="loadHistoryItem('${e.id}')"><div class="history-item-time">${e.timestamp}</div><div class="history-item-model">${e.model}</div><div class="history-item-preview">${e.responsePreview}</div></div>`).join('');
      document.getElementById('history-panel').classList.add('visible');
    }
    
    window.hideHistory = () => document.getElementById('history-panel').classList.remove('visible');
    window.loadHistoryItem = (id) => { ipcRenderer.send('load-history-item', id); hideHistory(); };
    
    // Chat functionality
    window.sendChatMessage = function(event) {
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message || isProcessing) return;
      
      input.value = '';
      isProcessing = true;
      updateChatUI();
      ipcRenderer.send('chat-message', message);
    };
    
    function updateChatUI() {
      const input = document.getElementById('chat-input');
      const btn = document.getElementById('chat-send');
      if (input) input.disabled = isProcessing;
      if (btn) btn.disabled = isProcessing;
    }
    
    // Model panel functionality
    window.showModelPanel = function() {
      ipcRenderer.send('request-models');
    };
    
    window.hideModelPanel = () => document.getElementById('model-panel').classList.remove('visible');
    
    function renderModelPanel(data) {
      providers = data.providers || [];
      currentProvider = data.currentProvider;
      currentModel = data.currentModel;
      
      const providerTabs = providers.map(p => 
        `<button class="provider-tab ${p.name === currentProvider ? 'active' : ''}" onclick="selectProvider('${p.name}')">${p.name}</button>`
      ).join('');
      
      const currentProviderData = providers.find(p => p.name === currentProvider);
      const models = currentProviderData?.models || [];
      const modelList = models.map((m, idx) => 
        `<div class="history-item ${m.name === currentModel.name ? 'style=\"border-left: 3px solid var(--accent-color)\"' : ''}" onclick="selectModel(${idx})">
          <div class="history-item-model">${m.displayName}</div>
          <div class="history-item-time">${m.supportsVision ? '📷 Vision' : 'Text only'}</div>
        </div>`
      ).join('');
      
      document.getElementById('model-content').innerHTML = `
        <div class="provider-tabs">${providerTabs}</div>
        <div class="model-list">${modelList}</div>
      `;
      document.getElementById('model-panel').classList.add('visible');
    }
    
    window.selectProvider = function(providerName) {
      ipcRenderer.send('select-provider', providerName);
    };
    
    window.selectModel = function(index) {
      ipcRenderer.send('select-model', index);
      hideModelPanel();
    };
    
    function showSettings(settings) {
      document.getElementById('settings-content').innerHTML = `
        <div class="settings-group">
          <div class="settings-group-title">Model Selection</div>
          <div class="model-selector">
            <label>Current Model</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <span style="flex:1;padding:8px;background:var(--bg-secondary);border-radius:4px;font-size:12px;">${currentModel.displayName || 'Not selected'}</span>
              <button class="settings-btn" style="width:auto;margin:0;" onclick="ipcRenderer.send('save-settings')">Save</button>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">Appearance</div>
          <div class="settings-item"><label>Dark Mode</label><input type="checkbox" ${darkMode ? 'checked' : ''} onchange="toggleDarkModeLocal(this.checked)"></div>
          <div class="transparency-control">
            <label>Transparency <span id="transparency-value">${transparency}%</span></label>
            <input type="range" class="transparency-slider" min="20" max="100" value="${transparency}" oninput="setTransparency(this.value)">
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">Keyboard Shortcuts</div>
          <div class="settings-item"><label>Capture</label><span>Ctrl+Shift+S</span></div>
          <div class="settings-item"><label>Add Image</label><span>Ctrl+Shift+A</span></div>
          <div class="settings-item"><label>Switch Model</label><span>Ctrl+Shift+2</span></div>
          <div class="settings-item"><label>Switch Prompt</label><span>Ctrl+Shift+T</span></div>
          <div class="settings-item"><label>Dark Mode</label><span>Ctrl+Shift+D</span></div>
          <div class="settings-item"><label>Less Transparent</label><span>Ctrl+Shift+[</span></div>
          <div class="settings-item"><label>More Transparent</label><span>Ctrl+Shift+]</span></div>
          <div class="settings-item"><label>History</label><span>Ctrl+Shift+H</span></div>
          <div class="settings-item"><label>Export</label><span>Ctrl+Shift+M</span></div>
          <div class="settings-item"><label>Reset</label><span>Ctrl+Shift+R</span></div>
          <div class="settings-item"><label>Hide/Show</label><span>Ctrl+Shift+E</span></div>
        </div>`;
      document.getElementById('settings-panel').classList.add('visible');
    }
    
    // Transparency control
    window.setTransparency = function(value) {
      transparency = parseInt(value);
      document.getElementById('transparency-value').textContent = transparency + '%';
      ipcRenderer.send('set-transparency', transparency / 100);
    };
    
    // Open settings panel
    window.openSettingsPanel = function() {
      ipcRenderer.send('request-settings');
    };
    
    // Capture screen
    window.captureScreen = function() {
      ipcRenderer.send('capture-screen');
    };
    
    window.hideSettings = () => document.getElementById('settings-panel').classList.remove('visible');
    window.toggleDarkModeLocal = (enabled) => { setDarkMode(enabled); ipcRenderer.send('setting-changed', { key: 'theme', value: enabled ? 'dark' : 'light' }); };
    
    const handlers = {
      'analysis-result': (event, result) => {
        showOverlay();
        isProcessing = false;
        document.getElementById('response-box').innerHTML = renderResponseWithUI(result);
        document.querySelectorAll('#response-box pre code').forEach(hljs.highlightElement);
        if (ttsEnabled) speakText(result);
      },
      'streaming-update': (event, content) => {
        showOverlay();
        isProcessing = true;
        document.getElementById('response-box').innerHTML = renderResponseWithUI(content, false) + '<span class="streaming-cursor"></span>';
      },
      'error': (event, error) => {
        showOverlay();
        isProcessing = false;
        document.getElementById('response-box').innerHTML = `<div class="error-message"><strong>Error:</strong> ${error}<br><small>Press Ctrl+Shift+R to try again</small></div>`;
      },
      'update-instruction': (event, instruction) => updateBanner(instruction, true),
      'hide-instruction': () => updateBanner('', false),
      'hide-app': () => { updateBanner('', false); hideOverlay(); },
      'show-app': () => { updateBanner('', true); showOverlay(); },
      'clear-result': () => { document.getElementById('response-box').innerHTML = ""; hideOverlay(); isProcessing = false; },
      'show-notification': (event, message) => {
        const n = document.getElementById('notification');
        n.textContent = message;
        n.classList.add('visible');
        setTimeout(() => n.classList.remove('visible'), 2000);
      },
      'copy-content': () => {
        const text = document.getElementById('response-box').innerText || '';
        clipboard.writeText(text);
        const n = document.getElementById('notification');
        n.textContent = 'Copied!';
        n.classList.add('visible');
        setTimeout(() => n.classList.remove('visible'), 2000);
      },
      'toggle-dark-mode': (event, enabled) => setDarkMode(enabled),
      'transparency-changed': (event, value) => {
        transparency = value;
        const el = document.getElementById('transparency-value');
        if (el) el.textContent = transparency + '%';
      },
      'show-history': (event, history) => showHistory(history),
      'show-settings': (event, settings) => showSettings(settings),
      'show-models': (event, data) => renderModelPanel(data),
      'model-changed': (event, model) => {
        currentModel = model;
        const badge = document.querySelector('.model-badge');
        if (badge) badge.textContent = model.displayName;
      },
      'provider-changed': (event, data) => {
        currentProvider = data.provider;
        currentModel = data.model;
        renderModelPanel({ providers, currentProvider, currentModel });
      },
      'processing-started': () => {
        isProcessing = true;
        updateChatUI();
      },
      'processing-ended': () => {
        isProcessing = false;
        updateChatUI();
      }
    };
    
    Object.entries(handlers).forEach(([channel, handler]) => ipcRenderer.on(channel, handler));
    window.addEventListener('unload', () => { Object.keys(handlers).forEach(ch => ipcRenderer.removeAllListeners(ch)); });
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setDarkMode(true);
    
    // Request initial model info
    ipcRenderer.send('request-current-model');
  </script>
</body>
</html>
